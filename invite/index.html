<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>NMAO Compete — Your Tournament Invite</title>
<style>
  :root { --gold:#C9A84C; --bg:#0E0E0E; --surface:#1A1A1A; --border:#333; --white:#F5F0E8; --muted:#8a8278; }
  * { box-sizing:border-box; }
  html,body { margin:0; background:var(--bg); color:var(--white); font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif; -webkit-font-smoothing:antialiased; }
  .wrap { min-height:100dvh; display:flex; align-items:center; justify-content:center; padding:1.5rem; }
  .card { width:100%; max-width:420px; background:var(--surface); border:1px solid var(--border); border-top:3px solid var(--gold); border-radius:6px; padding:2rem 1.75rem; text-align:center; }
  .brand { font-family:Georgia,"Times New Roman",serif; letter-spacing:0.35em; color:var(--gold); font-size:0.8rem; text-transform:uppercase; margin-bottom:1.25rem; }
  .trophy { font-size:2.4rem; margin-bottom:0.75rem; }
  h1 { font-family:Georgia,serif; font-size:1.5rem; margin:0 0 0.5rem; color:var(--white); }
  p { font-size:0.95rem; line-height:1.55; color:var(--muted); margin:0 0 1.25rem; }
  .btn { display:inline-block; background:var(--gold); color:#111; font-weight:600; text-decoration:none; padding:0.85rem 1.5rem; border-radius:4px; font-size:0.95rem; }
  .btn.ghost { background:transparent; color:var(--gold); border:1px solid var(--gold); margin-top:0.6rem; }
  .fine { font-size:0.78rem; color:var(--muted); margin-top:1.5rem; }
  .err { color:#E07070; }
</style>
</head>
<body>
  <div class="wrap">
    <div class="card">
      <div class="brand">NMAO&nbsp;Compete</div>
      <div class="trophy">🏆</div>
      <h1>Your Tournament Invite</h1>
      <p id="msg">Opening the NMAO&nbsp;Compete app…</p>
      <a id="openBtn" class="btn" href="#">Open in the app</a>
      <a id="storeBtn" class="btn ghost" href="#">Get NMAO&nbsp;Compete</a>
      <p class="fine">Open this link on your iPhone or iPad to accept your child's tournament invite and complete their consent, season, and payment.</p>
    </div>
  </div>
  <script>
    (function(){
      var t = new URLSearchParams(location.search).get('t') || '';
      var scheme = 'nmao-compete://invite?t=' + encodeURIComponent(t);
      // NMAO Compete App Store Connect app id (us.nmao.compete).
      var appstore = 'https://apps.apple.com/app/id6812842694';
      var msg = document.getElementById('msg');
      var openBtn = document.getElementById('openBtn');
      var storeBtn = document.getElementById('storeBtn');
      storeBtn.href = appstore;
      if (!t) {
        msg.className = 'err';
        msg.textContent = 'This link is missing its invite code. Please open the exact link your school sent you.';
        openBtn.style.display = 'none';
        return;
      }
      openBtn.href = scheme;
      // Auto-attempt to open the app via its custom scheme (works if installed).
      setTimeout(function(){ try { location.href = scheme; } catch (e) {} }, 400);
      // If we're still here after a moment, the app isn't installed — guide to the store.
      setTimeout(function(){ msg.textContent = "Don't have the app yet? Install NMAO Compete, then reopen this link."; }, 1800);
    })();
  </script>
</body>
</html>
